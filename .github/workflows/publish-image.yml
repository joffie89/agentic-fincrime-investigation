name: Publish container image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_KEY: ci-test-api-key-placeholder
      SERVICE_MODE: local
      LLM_ASSESSMENT_ENABLED: "true"
      EMBEDDING_MODE: local
      PERSISTENCE_BACKEND: memory

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt
          python -m pip check

      - name: Run tests
        run: python -m pytest -q

      - name: Verify local environment files are excluded
        run: |
          grep -Fxq ".env" .dockerignore
          grep -Fxq ".env.*" .dockerignore

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/joffie89/agentic-fincrime-investigation:latest
            ghcr.io/joffie89/agentic-fincrime-investigation:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: test-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_RESOURCE_GROUP: fincrime-demo-rg
      AZURE_CONTAINER_APP: fincrime-api
      IMAGE: ghcr.io/joffie89/agentic-fincrime-investigation:${{ github.sha }}

    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy commit image
        shell: bash
        run: |
          revision_suffix="${GITHUB_SHA:0:7}"
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --revision-suffix "$revision_suffix"

      - name: Wait for a healthy deployment
        shell: bash
        run: |
          app_fqdn="$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          if [[ -z "$app_fqdn" ]]; then
            echo "The container app does not have an ingress FQDN."
            exit 1
          fi

          health_url="https://${app_fqdn}/health"
          deadline=$(( $(date +%s) + 120 ))
          echo "Waiting up to 2 minutes for ${health_url}"

          while true; do
            now=$(date +%s)
            remaining=$(( deadline - now ))
            if (( remaining <= 0 )); then
              break
            fi

            request_timeout=$(( remaining < 10 ? remaining : 10 ))
            if response="$(curl \
              --fail \
              --silent \
              --show-error \
              --max-time "$request_timeout" \
              "$health_url")" && \
              jq -e '.status == "healthy"' <<<"$response" >/dev/null; then
              echo "Container app is healthy."
              exit 0
            fi

            now=$(date +%s)
            remaining=$(( deadline - now ))
            if (( remaining > 0 )); then
              sleep_seconds=$(( remaining < 5 ? remaining : 5 ))
              sleep "$sleep_seconds"
            fi
          done

          echo "Container app did not become healthy within 2 minutes."
          exit 1
