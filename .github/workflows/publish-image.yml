name: Publish container image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_KEY: ci-test-api-key-placeholder
      SERVICE_MODE: local
      LLM_ASSESSMENT_ENABLED: "true"
      EMBEDDING_MODE: local
      PERSISTENCE_BACKEND: memory

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt
          python -m pip check

      - name: Run tests
        run: python -m pytest -q

      - name: Verify local environment files are excluded
        run: |
          grep -Fxq ".env" .dockerignore
          grep -Fxq ".env.*" .dockerignore

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/joffie89/agentic-fincrime-investigation:latest
            ghcr.io/joffie89/agentic-fincrime-investigation:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
