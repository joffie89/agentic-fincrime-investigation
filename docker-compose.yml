services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fincrime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fincrime}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      APP_ENV: container
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      SERVICE_MODE: ${SERVICE_MODE:-local}
      LLM_ASSESSMENT_ENABLED: ${LLM_ASSESSMENT_ENABLED:-true}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-local}
      PERSISTENCE_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-fincrime}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-fincrime}
      POLICY_INDEX_PATH: ${POLICY_INDEX_PATH:-data/policy_index.json}
      RETRIEVAL_MODE:
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-3}
      HUMAN_REVIEW_CONFIDENCE_THRESHOLD: ${HUMAN_REVIEW_CONFIDENCE_THRESHOLD:-0.70}
      QA_SAMPLE_RATE: ${QA_SAMPLE_RATE:-0.05}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_ASSESSMENT_TEMPERATURE: ${OPENAI_ASSESSMENT_TEMPERATURE:-0}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_INPUT_PRICE_PER_1M: ${OPENAI_INPUT_PRICE_PER_1M:-0.40}
      OPENAI_OUTPUT_PRICE_PER_1M: ${OPENAI_OUTPUT_PRICE_PER_1M:-1.60}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
